<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Búsqueda sin índice</title>

    <!-- ====================================================== -->
    <!-- EL DISEÑO de la página                                 -->
    <!-- ====================================================== -->
    <style>
      body {
        max-width: 820px;
        margin: 40px auto;
        padding: 0 16px;
        font-family: sans-serif;
        font-size: 26px;
      }

      h1 {
        font-size: 3rem;
      }

      input,
      button {
        padding: 12px 16px;
        font-size: inherit;
      }

      input {
        width: 460px;
      }

      #tiempo {
        margin: 24px 0 0;
        color: #d97706;
        font-size: 5rem;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- ====================================================== -->
    <!-- LO QUE SE VE en la página                              -->
    <!-- ====================================================== -->

    <h1>Búsqueda sin índice</h1>

    <p><code>SELECT * FROM contacto WHERE correo = ?</code></p>

    <input id="correo" value="contacto777777@correo.com" />
    <button onclick="buscar()">Buscar</button>

    <!-- Aquí aparece el tiempo -->
    <p id="tiempo"></p>

    <!-- Aquí aparece el contacto encontrado -->
    <p id="contacto"></p>

    <!-- ====================================================== -->
    <!-- LO QUE PASA al hacer clic en Buscar                    -->
    <!-- ====================================================== -->
    <script>
      async function buscar() {
        // 1. Se lee el correo escrito en la caja de texto.
        const correo = document.getElementById('correo').value;

        // 2. Se le pide la búsqueda al servidor y se espera su respuesta.
        const respuesta = await fetch('/buscar?correo=' + correo);
        const resultado = await respuesta.json();

        // 3. Se muestra el tiempo, con tres decimales.
        const tiempo = document.getElementById('tiempo');
        tiempo.textContent = resultado.milisegundos.toFixed(3) + ' ms';

        // 4. Se muestra el contacto, si existe.
        const contacto = document.getElementById('contacto');

        if (resultado.contacto) {
          contacto.textContent = 'Encontrado: ' + resultado.contacto.nombre;
        } else {
          contacto.textContent = 'No existe ese contacto.';
        }
      }
    </script>
  </body>
</html>
