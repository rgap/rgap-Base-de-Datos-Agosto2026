<svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="800" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Modelo Entidad-Relación — Notación Pata de Gallo (Crow's Foot)</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Cardinalidad expresada como min..max</text>

  <!-- ============ FILA 1: Departamento (1..1) - Provincia (1..N) ============ -->
  <g>
    <rect x="30" y="75" width="180" height="55" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="120" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Departamento</text>

    <rect x="750" y="75" width="180" height="55" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="840" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Provincia</text>

    <line x1="210" y1="102" x2="750" y2="102" stroke="#374151" stroke-width="2"/>

    <!-- IZQUIERDA: 1..1 (doble barra: max=1, min=1) -->
    <line x1="210" y1="94" x2="210" y2="110" stroke="#374151" stroke-width="2"/>
    <line x1="218" y1="94" x2="218" y2="110" stroke="#374151" stroke-width="2"/>

    <!-- DERECHA: 1..N (pata de gallo=max muchos, barra=min 1) -->
    <line x1="732" y1="102" x2="750" y2="94"  stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="102" x2="750" y2="102" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="102" x2="750" y2="110" stroke="#374151" stroke-width="2"/>
    <line x1="726" y1="94" x2="726" y2="110" stroke="#374151" stroke-width="2"/>

    <text x="222" y="88" font-size="13" fill="#b91c1c" font-weight="bold">1..1</text>
    <text x="676" y="88" font-size="13" fill="#b91c1c" font-weight="bold">1..N</text>

    <text x="300" y="90" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">tiene</text>
    <text x="655" y="120" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">pertenece a</text>
  </g>

  <!-- ============ FILA 2: Empleado (1..1) - Boleta de Pago (0..N) ============ -->
  <g>
    <rect x="30" y="165" width="180" height="55" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="120" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Empleado</text>

    <rect x="750" y="165" width="180" height="55" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="840" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Boleta de</text>
    <text x="840" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Pago</text>

    <line x1="210" y1="192" x2="750" y2="192" stroke="#374151" stroke-width="2"/>

    <!-- IZQUIERDA: 1..1 -->
    <line x1="210" y1="184" x2="210" y2="200" stroke="#374151" stroke-width="2"/>
    <line x1="218" y1="184" x2="218" y2="200" stroke="#374151" stroke-width="2"/>

    <!-- DERECHA: 0..N (pata de gallo=max muchos, circulo=min 0) -->
    <line x1="732" y1="192" x2="750" y2="184" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="192" x2="750" y2="192" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="192" x2="750" y2="200" stroke="#374151" stroke-width="2"/>
    <circle cx="722" cy="192" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>

    <text x="222" y="178" font-size="13" fill="#b91c1c" font-weight="bold">1..1</text>
    <text x="668" y="178" font-size="13" fill="#b91c1c" font-weight="bold">0..N</text>

    <text x="305" y="180" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">genera</text>
    <text x="655" y="210" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">pertenece a</text>
  </g>

  <!-- ============ FILA 3: Alumno (0..N) - Examen (0..N) ============ -->
  <g>
    <rect x="30" y="255" width="180" height="55" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
    <text x="120" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">Alumno</text>

    <rect x="750" y="255" width="180" height="55" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
    <text x="840" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">Examen</text>

    <line x1="210" y1="282" x2="750" y2="282" stroke="#374151" stroke-width="2"/>

    <!-- IZQUIERDA: 0..N -->
    <line x1="228" y1="282" x2="210" y2="274" stroke="#374151" stroke-width="2"/>
    <line x1="228" y1="282" x2="210" y2="282" stroke="#374151" stroke-width="2"/>
    <line x1="228" y1="282" x2="210" y2="290" stroke="#374151" stroke-width="2"/>
    <circle cx="238" cy="282" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>

    <!-- DERECHA: 0..N -->
    <line x1="732" y1="282" x2="750" y2="274" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="282" x2="750" y2="282" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="282" x2="750" y2="290" stroke="#374151" stroke-width="2"/>
    <circle cx="722" cy="282" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>

    <text x="245" y="268" font-size="13" fill="#b91c1c" font-weight="bold">0..N</text>
    <text x="668" y="268" font-size="13" fill="#b91c1c" font-weight="bold">0..N</text>

    <text x="320" y="270" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">rinde</text>
    <text x="640" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">es rendido por</text>
  </g>

  <!-- ============ FILA 4: Persona (0..1) - Acta de Nacimiento (1..1) ============ -->
  <g>
    <rect x="30" y="345" width="180" height="55" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="120" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Persona</text>

    <rect x="750" y="345" width="180" height="55" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="840" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Acta de</text>
    <text x="840" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Nacimiento</text>

    <line x1="210" y1="372" x2="750" y2="372" stroke="#374151" stroke-width="2"/>

    <!-- IZQUIERDA: 0..1 (barra=max 1, circulo=min 0) -->
    <line x1="210" y1="364" x2="210" y2="380" stroke="#374151" stroke-width="2"/>
    <circle cx="222" cy="372" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>

    <!-- DERECHA: 1..1 -->
    <line x1="750" y1="364" x2="750" y2="380" stroke="#374151" stroke-width="2"/>
    <line x1="742" y1="364" x2="742" y2="380" stroke="#374151" stroke-width="2"/>

    <text x="232" y="358" font-size="13" fill="#b91c1c" font-weight="bold">0..1</text>
    <text x="700" y="358" font-size="13" fill="#b91c1c" font-weight="bold">1..1</text>

    <text x="300" y="360" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">posee</text>
    <text x="660" y="390" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">pertenece a</text>
  </g>

  <!-- ============ FILA 5: Cliente (0..N) - Producto (0..N) ============ -->
  <g>
    <rect x="30" y="435" width="180" height="55" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
    <text x="120" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Cliente</text>

    <rect x="750" y="435" width="180" height="55" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
    <text x="840" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Producto</text>

    <line x1="210" y1="462" x2="750" y2="462" stroke="#374151" stroke-width="2"/>

    <!-- IZQUIERDA: 0..N -->
    <line x1="228" y1="462" x2="210" y2="454" stroke="#374151" stroke-width="2"/>
    <line x1="228" y1="462" x2="210" y2="462" stroke="#374151" stroke-width="2"/>
    <line x1="228" y1="462" x2="210" y2="470" stroke="#374151" stroke-width="2"/>
    <circle cx="238" cy="462" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>

    <!-- DERECHA: 0..N -->
    <line x1="732" y1="462" x2="750" y2="454" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="462" x2="750" y2="462" stroke="#374151" stroke-width="2"/>
    <line x1="732" y1="462" x2="750" y2="470" stroke="#374151" stroke-width="2"/>
    <circle cx="722" cy="462" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>

    <text x="245" y="448" font-size="13" fill="#b91c1c" font-weight="bold">0..N</text>
    <text x="668" y="448" font-size="13" fill="#b91c1c" font-weight="bold">0..N</text>

    <text x="320" y="450" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">compra</text>
    <text x="630" y="480" text-anchor="middle" font-size="13" font-style="italic" fill="#065f46">es comprado por</text>
  </g>

  <!-- ============ LEYENDA ============ -->
  <g>
    <rect x="30" y="510" width="900" height="270" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="50" y="538" font-size="15" font-weight="bold" fill="#1f2937">Leyenda de notación (min..max)</text>

    <!-- 0..1 -->
    <line x1="65" y1="565" x2="105" y2="565" stroke="#374151" stroke-width="2"/>
    <line x1="65" y1="557" x2="65" y2="573" stroke="#374151" stroke-width="2"/>
    <circle cx="78" cy="565" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="120" y="570" font-size="13" fill="#1f2937">0..1  —  Cero o uno (barra = máx.1, círculo = mín.0)</text>

    <!-- 1..1 -->
    <line x1="65" y1="600" x2="105" y2="600" stroke="#374151" stroke-width="2"/>
    <line x1="65" y1="592" x2="65" y2="608" stroke="#374151" stroke-width="2"/>
    <line x1="73" y1="592" x2="73" y2="608" stroke="#374151" stroke-width="2"/>
    <text x="120" y="605" font-size="13" fill="#1f2937">1..1  —  Exactamente uno (doble barra)</text>

    <!-- 0..N -->
    <line x1="65" y1="635" x2="105" y2="635" stroke="#374151" stroke-width="2"/>
    <line x1="87" y1="635" x2="105" y2="627" stroke="#374151" stroke-width="2"/>
    <line x1="87" y1="635" x2="105" y2="635" stroke="#374151" stroke-width="2"/>
    <line x1="87" y1="635" x2="105" y2="643" stroke="#374151" stroke-width="2"/>
    <circle cx="75" cy="635" r="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="120" y="640" font-size="13" fill="#1f2937">0..N  —  Cero o muchos (pata de gallo = máx. muchos, círculo = mín.0)</text>

    <!-- 1..N -->
    <line x1="65" y1="670" x2="105" y2="670" stroke="#374151" stroke-width="2"/>
    <line x1="87" y1="670" x2="105" y2="662" stroke="#374151" stroke-width="2"/>
    <line x1="87" y1="670" x2="105" y2="670" stroke="#374151" stroke-width="2"/>
    <line x1="87" y1="670" x2="105" y2="678" stroke="#374151" stroke-width="2"/>
    <line x1="75" y1="662" x2="75" y2="678" stroke="#374151" stroke-width="2"/>
    <text x="120" y="675" font-size="13" fill="#1f2937">1..N  —  Uno o muchos (pata de gallo = máx. muchos, barra = mín.1)</text>

    <text x="50" y="710" font-size="12" fill="#065f46" font-style="italic">Verbo en verde: etiqueta de la relación, una en cada extremo (doble label / lectura en ambos sentidos)</text>

    <text x="50" y="735" font-size="12" fill="#374151" font-weight="bold">Resumen de relaciones:</text>
    <text x="50" y="755" font-size="11.5" fill="#374151">Departamento (1..1) — Provincia (1..N)   |   Empleado (1..1) — Boleta de Pago (0..N)   |   Alumno (0..N) — Examen (0..N)</text>
    <text x="50" y="772" font-size="11.5" fill="#374151">Persona (0..1) — Acta de Nacimiento (1..1)   |   Cliente (0..N) — Producto (0..N)</text>
  </g>
</svg>
