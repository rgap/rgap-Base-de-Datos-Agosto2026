<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#f7f8fb"/>

  <text x="500" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2a44">Registros de datos — tabla PRODUCTOS</text>
  <text x="500" y="70" text-anchor="middle" font-size="16" fill="#5a6683">Campo · Valor · Registro · Tabla</text>

  <!-- ===== marco de TABLA ===== -->
  <rect x="185" y="140" width="640" height="250" rx="6" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="505" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">TABLA (table) — todos los registros de la entidad PRODUCTO</text>

  <!-- ===== encabezado ===== -->
  <rect x="185" y="140" width="160" height="46" fill="#2f6fb5" stroke="#ffffff"/>
  <rect x="345" y="140" width="200" height="46" fill="#2f6fb5" stroke="#ffffff"/>
  <rect x="545" y="140" width="140" height="46" fill="#2f6fb5" stroke="#ffffff"/>
  <rect x="685" y="140" width="140" height="46" fill="#2f6fb5" stroke="#ffffff"/>
  <text x="265" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">id_producto</text>
  <text x="445" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">nombre</text>
  <text x="615" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">precio</text>
  <text x="755" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">stock</text>

  <!-- ===== filas ===== -->
  <g font-size="14" fill="#1f2a44">
    <!-- fila 1 destacada -->
    <rect x="185" y="186" width="640" height="46" fill="#fff2e6" stroke="#c2410c" stroke-width="2"/>
    <line x1="345" y1="186" x2="345" y2="232" stroke="#e5e7eb"/>
    <line x1="545" y1="186" x2="545" y2="232" stroke="#e5e7eb"/>
    <line x1="685" y1="186" x2="685" y2="232" stroke="#e5e7eb"/>
    <text x="265" y="215" text-anchor="middle" font-weight="700">88</text>
    <text x="445" y="215" text-anchor="middle">Audífonos X</text>
    <text x="615" y="215" text-anchor="middle">300.00</text>
    <text x="755" y="215" text-anchor="middle">42</text>

    <rect x="185" y="232" width="640" height="46" fill="#ffffff" stroke="#e5e7eb"/>
    <line x1="345" y1="232" x2="345" y2="278" stroke="#e5e7eb"/>
    <line x1="545" y1="232" x2="545" y2="278" stroke="#e5e7eb"/>
    <line x1="685" y1="232" x2="685" y2="278" stroke="#e5e7eb"/>
    <text x="265" y="261" text-anchor="middle">89</text>
    <text x="445" y="261" text-anchor="middle">Teclado Pro</text>
    <text x="615" y="261" text-anchor="middle">150.00</text>
    <text x="755" y="261" text-anchor="middle">18</text>

    <rect x="185" y="278" width="640" height="46" fill="#ffffff" stroke="#e5e7eb"/>
    <line x1="345" y1="278" x2="345" y2="324" stroke="#e5e7eb"/>
    <line x1="545" y1="278" x2="545" y2="324" stroke="#e5e7eb"/>
    <line x1="685" y1="278" x2="685" y2="324" stroke="#e5e7eb"/>
    <text x="265" y="307" text-anchor="middle">90</text>
    <text x="445" y="307" text-anchor="middle">Mouse Slim</text>
    <text x="615" y="307" text-anchor="middle">80.00</text>
    <text x="755" y="307" text-anchor="middle">65</text>

    <rect x="185" y="324" width="640" height="46" fill="#ffffff" stroke="#e5e7eb"/>
    <line x1="345" y1="324" x2="345" y2="370" stroke="#e5e7eb"/>
    <line x1="545" y1="324" x2="545" y2="370" stroke="#e5e7eb"/>
    <line x1="685" y1="324" x2="685" y2="370" stroke="#e5e7eb"/>
    <text x="265" y="353" text-anchor="middle">91</text>
    <text x="445" y="353" text-anchor="middle">Monitor 24"</text>
    <text x="615" y="353" text-anchor="middle">890.00</text>
    <text x="755" y="353" text-anchor="middle">7</text>
  </g>

  <!-- ===== CAMPO (columna) ===== -->
  <rect x="545" y="132" width="140" height="246" rx="4" fill="none" stroke="#15803d" stroke-width="3"/>
  <path d="M 615 132 L 615 105" stroke="#15803d" stroke-width="2"/>
  <rect x="512" y="80" width="206" height="26" rx="6" fill="#15803d"/>
  <text x="615" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CAMPO (field) = columna</text>

  <!-- ===== REGISTRO (fila) ===== -->
  <path d="M 185 209 L 130 209" stroke="#c2410c" stroke-width="2"/>
  <polygon points="185,209 173,203 173,215" fill="#c2410c"/>
  <rect x="10" y="180" width="122" height="58" rx="6" fill="#c2410c"/>
  <text x="71" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">REGISTRO</text>
  <text x="71" y="222" text-anchor="middle" font-size="12" fill="#ffe8d9">(record) = fila</text>

  <!-- ===== VALOR (celda) ===== -->
  <rect x="685" y="186" width="140" height="46" fill="none" stroke="#b8860b" stroke-width="3"/>
  <path d="M 825 209 L 890 209" stroke="#b8860b" stroke-width="2"/>
  <polygon points="890,209 878,203 878,215" fill="#b8860b"/>
  <rect x="890" y="180" width="100" height="58" rx="6" fill="#b8860b"/>
  <text x="940" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VALOR</text>
  <text x="940" y="222" text-anchor="middle" font-size="12" fill="#fff5d9">(value) = celda</text>

  <!-- ===== caja inferior ===== -->
  <rect x="40" y="450" width="920" height="170" rx="12" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="64" y="483" font-size="16" font-weight="700" fill="#1f2a44">La frase del slide, desarmada</text>

  <circle cx="72" cy="512" r="5" fill="#c2410c"/>
  <text x="90" y="517" font-size="14" fill="#1f2a44"><tspan font-weight="700">"Instancia específica"</tspan> = un ejemplar real. La entidad es PRODUCTO; el registro es <tspan font-style="italic">este</tspan> producto, el 88.</text>

  <circle cx="72" cy="542" r="5" fill="#15803d"/>
  <text x="90" y="547" font-size="14" fill="#1f2a44">El campo dice <tspan font-weight="700">qué tipo</tspan> de dato se guarda; el valor es <tspan font-weight="700">el dato concreto</tspan> de esa celda.</text>

  <circle cx="72" cy="572" r="5" fill="#7c3aed"/>
  <text x="90" y="577" font-size="14" fill="#1f2a44">La tabla reúne todos los registros: 4 filas aquí, 500 si la tienda tiene 500 productos.</text>

  <text x="90" y="604" font-size="13" font-style="italic" fill="#5a6683">Analogía de clase: la hoja de Excel es la tabla, la columna el campo, la fila el registro y la celda el valor.</text>
</svg>
