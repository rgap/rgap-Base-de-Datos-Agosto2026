<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="700" viewBox="0 0 1030 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1030" height="700" fill="#ffffff"/>

  <text x="515" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f3864">E-commerce — Modelo entidad-relación en notación IDEF1X</text>

  <!-- ============ CLIENTE (independiente) ============ -->
  <rect x="60" y="60" width="250" height="152" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
  <rect x="60" y="60" width="250" height="30" fill="#1f3864"/>
  <text x="185" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">CLIENTE</text>
  <text x="74" y="112" font-size="12" font-weight="600" fill="#000000">id_cliente</text>
  <line x1="60" y1="122" x2="310" y2="122" stroke="#1f3864" stroke-width="2"/>
  <text x="74" y="142" font-size="12" fill="#333333">nombre</text>
  <text x="74" y="162" font-size="12" fill="#333333">correo</text>
  <text x="74" y="182" font-size="12" fill="#333333">telefono</text>
  <text x="74" y="202" font-size="12" fill="#333333">direccion</text>

  <!-- ============ PEDIDO (independiente) ============ -->
  <rect x="60" y="280" width="250" height="152" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
  <rect x="60" y="280" width="250" height="30" fill="#1f3864"/>
  <text x="185" y="301" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">PEDIDO</text>
  <text x="74" y="332" font-size="12" font-weight="600" fill="#000000">id_pedido</text>
  <line x1="60" y1="342" x2="310" y2="342" stroke="#1f3864" stroke-width="2"/>
  <text x="74" y="362" font-size="12" fill="#333333">fecha</text>
  <text x="74" y="382" font-size="12" fill="#333333">estado</text>
  <text x="74" y="402" font-size="12" fill="#333333">total</text>
  <text x="74" y="422" font-size="12" fill="#c00000">id_cliente (FK)</text>

  <!-- ============ CATEGORIA (independiente) ============ -->
  <rect x="740" y="60" width="230" height="112" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
  <rect x="740" y="60" width="230" height="30" fill="#1f3864"/>
  <text x="855" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">CATEGORIA</text>
  <text x="754" y="112" font-size="12" font-weight="600" fill="#000000">id_categoria</text>
  <line x1="740" y1="122" x2="970" y2="122" stroke="#1f3864" stroke-width="2"/>
  <text x="754" y="142" font-size="12" fill="#333333">nombre</text>
  <text x="754" y="162" font-size="12" fill="#333333">descripcion</text>

  <!-- ============ PRODUCTO (independiente) ============ -->
  <rect x="740" y="280" width="230" height="152" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
  <rect x="740" y="280" width="230" height="30" fill="#1f3864"/>
  <text x="855" y="301" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">PRODUCTO</text>
  <text x="754" y="332" font-size="12" font-weight="600" fill="#000000">id_producto</text>
  <line x1="740" y1="342" x2="970" y2="342" stroke="#1f3864" stroke-width="2"/>
  <text x="754" y="362" font-size="12" fill="#333333">nombre</text>
  <text x="754" y="382" font-size="12" fill="#333333">precio</text>
  <text x="754" y="402" font-size="12" fill="#333333">stock</text>
  <text x="754" y="422" font-size="12" fill="#c00000">id_categoria (FK)</text>

  <!-- ============ DETALLE_PEDIDO (dependiente: esquinas redondeadas) ============ -->
  <rect x="380" y="500" width="280" height="132" rx="16" ry="16" fill="#fff8e1" stroke="#bf8f00" stroke-width="2.5"/>
  <path d="M380,530 L380,516 A16,16 0 0 1 396,500 L644,500 A16,16 0 0 1 660,516 L660,530 Z" fill="#bf8f00"/>
  <text x="520" y="521" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">DETALLE_PEDIDO</text>
  <text x="396" y="552" font-size="12" font-weight="600" fill="#c00000">id_pedido (FK)</text>
  <text x="396" y="572" font-size="12" font-weight="600" fill="#c00000">id_producto (FK)</text>
  <line x1="380" y1="582" x2="660" y2="582" stroke="#bf8f00" stroke-width="2"/>
  <text x="396" y="602" font-size="12" fill="#333333">cantidad</text>
  <text x="396" y="622" font-size="12" fill="#333333">precio_unitario</text>

  <!-- ============ RELACION 1: CLIENTE - PEDIDO (no identificadora, punteada) ============ -->
  <line x1="185" y1="212" x2="185" y2="280" stroke="#1f3864" stroke-width="2" stroke-dasharray="7,5"/>
  <circle cx="185" cy="280" r="6" fill="#1f3864"/>
  <text x="196" y="250" font-size="11" font-style="italic" fill="#548235">realiza</text>

  <!-- ============ RELACION 2: CATEGORIA - PRODUCTO (no identificadora, punteada) ============ -->
  <line x1="855" y1="172" x2="855" y2="280" stroke="#1f3864" stroke-width="2" stroke-dasharray="7,5"/>
  <circle cx="855" cy="280" r="6" fill="#1f3864"/>
  <text x="866" y="230" font-size="11" font-style="italic" fill="#548235">clasifica</text>

  <!-- ============ RELACION 3: PEDIDO - DETALLE (identificadora, continua) ============ -->
  <path d="M185,432 L185,560 L374,560" fill="none" stroke="#1f3864" stroke-width="2.5"/>
  <circle cx="374" cy="560" r="6" fill="#1f3864"/>
  <text x="345" y="552" font-size="12" font-weight="600" fill="#c00000">P</text>
  <text x="215" y="552" font-size="11" font-style="italic" fill="#548235">contiene</text>

  <!-- ============ RELACION 4: PRODUCTO - DETALLE (identificadora, continua) ============ -->
  <path d="M855,432 L855,560 L666,560" fill="none" stroke="#1f3864" stroke-width="2.5"/>
  <circle cx="666" cy="560" r="6" fill="#1f3864"/>
  <text x="700" y="552" font-size="11" font-style="italic" fill="#548235">figura en</text>

  <!-- ============ LEYENDA ============ -->
  <rect x="350" y="70" width="360" height="330" fill="#f7f9fc" stroke="#b8cce4" stroke-width="1.5" rx="6"/>
  <text x="530" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#1f3864">Cómo leer IDEF1X</text>

  <rect x="368" y="110" width="34" height="20" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
  <text x="412" y="119" font-size="11" fill="#333333">Esquinas rectas =</text>
  <text x="412" y="132" font-size="11" font-weight="600" fill="#333333">entidad independiente</text>

  <rect x="368" y="146" width="34" height="20" rx="8" ry="8" fill="#fff8e1" stroke="#bf8f00" stroke-width="2"/>
  <text x="412" y="155" font-size="11" fill="#333333">Esquinas redondeadas =</text>
  <text x="412" y="168" font-size="11" font-weight="600" fill="#333333">entidad dependiente</text>

  <line x1="368" y1="192" x2="402" y2="192" stroke="#1f3864" stroke-width="2.5"/>
  <text x="412" y="189" font-size="11" fill="#333333">Línea continua =</text>
  <text x="412" y="202" font-size="11" font-weight="600" fill="#333333">relación identificadora</text>

  <line x1="368" y1="226" x2="402" y2="226" stroke="#1f3864" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="412" y="223" font-size="11" fill="#333333">Línea punteada =</text>
  <text x="412" y="236" font-size="11" font-weight="600" fill="#333333">relación no identificadora</text>

  <circle cx="385" cy="260" r="6" fill="#1f3864"/>
  <text x="412" y="257" font-size="11" fill="#333333">Punto relleno =</text>
  <text x="412" y="270" font-size="11" font-weight="600" fill="#333333">lado "muchos"</text>

  <line x1="368" y1="288" x2="402" y2="288" stroke="#1f3864" stroke-width="2"/>
  <text x="412" y="292" font-size="11" fill="#333333">Línea interna: separa la <tspan font-weight="600">PK</tspan></text>
  <text x="412" y="305" font-size="11" fill="#333333">(arriba) de los atributos (abajo)</text>

  <text x="368" y="332" font-size="11" font-weight="600" fill="#c00000">Cardinalidad:</text>
  <text x="368" y="349" font-size="11" fill="#333333">sin letra = cero, uno o muchos</text>
  <text x="368" y="365" font-size="11" fill="#333333"><tspan font-weight="600" fill="#c00000">P</tspan> = uno o muchos</text>
  <text x="368" y="381" font-size="11" fill="#333333"><tspan font-weight="600" fill="#c00000">Z</tspan> = cero o uno</text>

  <text x="515" y="670" text-anchor="middle" font-size="11.5" fill="#666666">DETALLE_PEDIDO es dependiente porque su clave primaria está formada por las claves foráneas de PEDIDO y PRODUCTO: no existe sin ellos.</text>
</svg>
