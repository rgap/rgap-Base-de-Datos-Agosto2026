<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="660" fill="#ffffff"/>

  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#1f3864"/>
    </marker>
    <marker id="flBi" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#548235"/>
    </marker>
    <marker id="flBiIni" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto">
      <path d="M10,0 L0,3.5 L10,7 z" fill="#548235"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f3864">Entorno de un SGBD</text>
  <text x="440" y="55" text-anchor="middle" font-size="12" fill="#666666">Sistema Gestor de Base de Datos — Elmasri y Navathe</text>

  <!-- NIVEL 1: USUARIOS -->
  <rect x="180" y="80" width="520" height="52" rx="6" fill="#2e75b6" stroke="#1f3864" stroke-width="2"/>
  <text x="440" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">USUARIOS / PROGRAMADORES</text>

  <line x1="440" y1="132" x2="440" y2="158" stroke="#1f3864" stroke-width="2.5" marker-end="url(#fl)"/>

  <!-- NIVEL 2: CONSULTAS Y PROGRAMAS -->
  <rect x="140" y="160" width="270" height="52" rx="6" fill="#9dc3e6" stroke="#2e75b6" stroke-width="2"/>
  <text x="275" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#000000">Consultas (SQL)</text>
  <text x="275" y="202" text-anchor="middle" font-size="11" fill="#333333">SELECT, INSERT, UPDATE...</text>

  <rect x="470" y="160" width="270" height="52" rx="6" fill="#9dc3e6" stroke="#2e75b6" stroke-width="2"/>
  <text x="605" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#000000">Programas de aplicación</text>
  <text x="605" y="202" text-anchor="middle" font-size="11" fill="#333333">web, móvil, escritorio</text>

  <line x1="440" y1="140" x2="275" y2="158" stroke="#1f3864" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="440" y1="140" x2="605" y2="158" stroke="#1f3864" stroke-width="2" marker-end="url(#fl)"/>

  <line x1="275" y1="212" x2="275" y2="248" stroke="#1f3864" stroke-width="2.5" marker-end="url(#fl)"/>
  <line x1="605" y1="212" x2="605" y2="248" stroke="#1f3864" stroke-width="2.5" marker-end="url(#fl)"/>

  <!-- NIVEL 3: SOFTWARE SGBD -->
  <rect x="120" y="250" width="640" height="180" rx="8" fill="#fff8e1" stroke="#bf8f00" stroke-width="3"/>
  <rect x="120" y="250" width="640" height="36" rx="8" fill="#bf8f00"/>
  <text x="440" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">SOFTWARE SGBD (DBMS)</text>

  <rect x="145" y="300" width="285" height="46" rx="5" fill="#ffffff" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="287" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#000000">Procesa consultas</text>
  <text x="287" y="336" text-anchor="middle" font-size="10.5" fill="#555555">interpreta, optimiza y ejecuta</text>

  <rect x="450" y="300" width="285" height="46" rx="5" fill="#ffffff" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="592" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#000000">Accede a los datos almacenados</text>
  <text x="592" y="336" text-anchor="middle" font-size="10.5" fill="#555555">lectura y escritura en disco</text>

  <rect x="145" y="360" width="180" height="52" rx="5" fill="#ffffff" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="235" y="380" text-anchor="middle" font-size="11.5" font-weight="600" fill="#000000">Seguridad</text>
  <text x="235" y="396" text-anchor="middle" font-size="10" fill="#555555">usuarios y permisos</text>

  <rect x="340" y="360" width="180" height="52" rx="5" fill="#ffffff" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="430" y="380" text-anchor="middle" font-size="11.5" font-weight="600" fill="#000000">Integridad</text>
  <text x="430" y="396" text-anchor="middle" font-size="10" fill="#555555">reglas y restricciones</text>

  <rect x="535" y="360" width="200" height="52" rx="5" fill="#ffffff" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="635" y="380" text-anchor="middle" font-size="11.5" font-weight="600" fill="#000000">Concurrencia y respaldo</text>
  <text x="635" y="396" text-anchor="middle" font-size="10" fill="#555555">varios usuarios a la vez</text>

  <!-- Flechas al almacenamiento -->
  <line x1="287" y1="430" x2="287" y2="490" stroke="#548235" stroke-width="2.5" marker-end="url(#flBi)" marker-start="url(#flBiIni)"/>
  <line x1="592" y1="430" x2="592" y2="490" stroke="#548235" stroke-width="2.5" marker-end="url(#flBi)" marker-start="url(#flBiIni)"/>

  <!-- NIVEL 4: ALMACENAMIENTO -->
  <rect x="100" y="470" width="680" height="140" rx="8" fill="#f2f7ec" stroke="#548235" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="440" y="494" text-anchor="middle" font-size="12" font-weight="600" fill="#548235">BASE DE DATOS ALMACENADA</text>

  <!-- Cilindro metadata -->
  <ellipse cx="287" cy="522" rx="105" ry="15" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
  <path d="M182,522 L182,572 A105,15 0 0 0 392,572 L392,522" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
  <text x="287" y="549" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f3864">METADATA</text>
  <text x="287" y="566" text-anchor="middle" font-size="10.5" fill="#333333">diccionario de datos / catálogo</text>
  <text x="287" y="600" text-anchor="middle" font-size="10.5" font-style="italic" fill="#548235">describe cómo están organizados los datos</text>

  <!-- Cilindro datos -->
  <ellipse cx="592" cy="522" rx="105" ry="15" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
  <path d="M487,522 L487,572 A105,15 0 0 0 697,572 L697,522" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
  <text x="592" y="549" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f3864">DATOS</text>
  <text x="592" y="566" text-anchor="middle" font-size="10.5" fill="#333333">tablas, filas, valores reales</text>
  <text x="592" y="600" text-anchor="middle" font-size="10.5" font-style="italic" fill="#548235">el contenido de la base de datos</text>

  <!-- Nota lateral -->
  <text x="800" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#c00000">Nadie</text>
  <text x="800" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#c00000">accede a</text>
  <text x="800" y="375" text-anchor="middle" font-size="11" font-weight="600" fill="#c00000">los datos</text>
  <text x="800" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#c00000">sin pasar</text>
  <text x="800" y="405" text-anchor="middle" font-size="11" font-weight="600" fill="#c00000">por aquí</text>
  <path d="M790,330 Q760,300 762,290" fill="none" stroke="#c00000" stroke-width="2" marker-end="url(#fl)"/>
  <text x="440" y="640" text-anchor="middle" font-size="11.5" fill="#666666">Ejemplos de SGBD: MySQL · PostgreSQL · Oracle · SQL Server · MariaDB</text>
</svg>
